<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder | Premium AI SaaS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/base.css">
    <link rel="stylesheet" href="../../static/css/dashboard.css">
    <link rel="stylesheet" href="../../static/css/resume-builder.css">
</head>
<body class="page-dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <span class="text-gradient">AI.</span>Core
            </div>
        </div>

        <nav class="nav-menu">
            <a href="/templates/dashboard/index.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Dashboard
            </a>
            <a href="/templates/dashboard/chat.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                AI Chat
            </a>
            <a href="/templates/dashboard/image-generator.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                Image Gen
            </a>
            <a href="/templates/dashboard/resume-builder.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Resume Builder
            </a>
            <a href="/templates/dashboard/code-assistant.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                Code Assistant
            </a>
        </nav>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <header class="topbar">
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Search...">
            </div>
            <div class="topbar-actions">
                <div class="user-avatar" style="width: 40px; height: 40px; border-radius: 50%; background: var(--gradient-primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">JS</div>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="resume-layout">
                
                <!-- Left Sidebar Editor -->
                <div class="resume-editor">
                    <div class="editor-header flex justify-between items-center">
                        <span>Editor</span>
                        <button id="aiGenerateBtn" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                            Auto-Optimize
                        </button>
                    </div>
                    
                    <div class="editor-body">
                        <div class="editor-section">
                            <h4>Personal Details</h4>
                            <div class="form-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-input" value="John Smith">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Professional Title</label>
                                <input type="text" class="form-input" value="Senior Frontend Engineer">
                            </div>
                        </div>

                        <div class="editor-section">
                            <h4>Experience</h4>
                            <div class="card" style="padding: 1rem; margin-bottom: 1rem;">
                                <div style="font-weight: 600; font-size: 0.875rem;">Tech Corp Inc.</div>
                                <div style="color: var(--text-secondary); font-size: 0.75rem;">2021 - Present</div>
                            </div>
                            <button class="btn btn-ghost w-full" style="border: 1px dashed var(--border-light);">+ Add Experience</button>
                        </div>
                    </div>
                </div>

                <!-- Right 3D Preview -->
                <div class="resume-preview-area">
                    <div class="preview-toolbar">
                        <button class="icon-btn" title="Download PDF">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        </button>
                    </div>
                    <div id="resume-canvas" class="floating-resume-canvas"></div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../../static/js/common.js"></script>
    <script src="../../static/js/resume-builder.js"></script>
</body>
</html>
