<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generator | Premium AI SaaS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/base.css">
    <link rel="stylesheet" href="../../static/css/dashboard.css">
    <link rel="stylesheet" href="../../static/css/image-generator.css">
</head>
<body class="page-dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <span class="text-gradient">AI.</span>Core
            </div>
        </div>

        <nav class="nav-menu">
            <a href="/templates/dashboard/index.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Dashboard
            </a>
            <a href="/templates/dashboard/chat.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                AI Chat
            </a>
            <a href="/templates/dashboard/image-generator.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                Image Gen
            </a>
            <a href="/templates/dashboard/resume-builder.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Resume Builder
            </a>
            <a href="/templates/dashboard/code-assistant.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                Code Assistant
            </a>
        </nav>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <header class="topbar">
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Search commands...">
            </div>
            <div class="topbar-actions">
                <div class="user-avatar" style="width: 40px; height: 40px; border-radius: 50%; background: var(--gradient-primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">JS</div>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="generator-layout">
                <!-- Canvas Area -->
                <div class="canvas-area">
                    <div class="image-preview">
                        <!-- 3D Camera Lens initially shown -->
                        <div id="lens-canvas" class="lens-container"></div>
                        
                        <!-- Output Image Container -->
                        <div id="generatedImage" class="generated-image-container"></div>
                    </div>
                    
                    <div class="prompt-bar">
                        <input type="text" id="promptInput" class="prompt-input" placeholder="Describe the image you want to generate...">
                        <button id="generateBtn" class="btn btn-primary">Generate</button>
                    </div>
                </div>

                <!-- Controls Area -->
                <aside class="controls-area">
                    <h3>Generation Settings</h3>
                    
                    <div class="control-group">
                        <label class="control-label">Aspect Ratio</label>
                        <select class="form-input" style="padding: 0.5rem; border-radius: var(--radius-sm);">
                            <option>1:1 (Square)</option>
                            <option>16:9 (Landscape)</option>
                            <option>9:16 (Portrait)</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label class="control-label">Style Preset</label>
                        <div class="style-grid">
                            <button class="style-btn active">Photorealistic</button>
                            <button class="style-btn">Cinematic</button>
                            <button class="style-btn">Anime</button>
                            <button class="style-btn">Cyberpunk</button>
                            <button class="style-btn">3D Render</button>
                            <button class="style-btn">Concept Art</button>
                        </div>
                    </div>

                    <div class="control-group mt-lg">
                        <label class="control-label">Creativity Scale</label>
                        <input type="range" min="1" max="10" value="7">
                        <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">
                            <span>Strict</span>
                            <span>Creative</span>
                        </div>
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="../../static/js/common.js"></script>
    <script src="../../static/js/image-generator.js"></script>
</body>
</html>
