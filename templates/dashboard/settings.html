<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Premium AI SaaS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/base.css">
    <link rel="stylesheet" href="../../static/css/dashboard.css">
    <link rel="stylesheet" href="../../static/css/settings.css">
</head>
<body class="page-dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <span class="text-gradient">AI.</span>Core
            </div>
        </div>

        <nav class="nav-menu">
            <a href="/templates/dashboard/index.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Dashboard
            </a>
            <a href="/templates/dashboard/chat.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                AI Chat
            </a>
            <a href="/templates/dashboard/image-generator.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                Image Gen
            </a>
            <a href="/templates/dashboard/resume-builder.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Resume Builder
            </a>
            <a href="/templates/dashboard/code-assistant.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                Code Assistant
            </a>
        </nav>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <header class="topbar">
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Search settings...">
            </div>
            <div class="topbar-actions">
                <div class="user-avatar" style="width: 40px; height: 40px; border-radius: 50%; background: var(--gradient-primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">JS</div>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="settings-layout">
                
                <!-- Settings Navigation -->
                <div class="settings-sidebar">
                    <a href="#" class="settings-nav-item active">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        Profile
                    </a>
                    <a href="#" class="settings-nav-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        Security
                    </a>
                    <a href="#" class="settings-nav-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                        API Keys
                    </a>
                    <a href="#" class="settings-nav-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        Billing
                    </a>
                </div>

                <!-- Settings Content -->
                <div class="settings-content">
                    <h2 class="settings-section-title">Profile Information</h2>
                    
                    <div class="avatar-upload-group">
                        <div class="avatar-preview">JS</div>
                        <div class="avatar-actions">
                            <button class="btn btn-primary" style="padding: 0.5rem 1rem;">Upload new</button>
                            <button class="btn btn-ghost" style="padding: 0.5rem 1rem; border: 1px solid var(--border-light);">Remove</button>
                        </div>
                    </div>

                    <form>
                        <div class="settings-form-row">
                            <div class="form-group">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-input" value="John">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-input" value="Smith">
                            </div>
                        </div>
                        
                        <div class="form-group" style="margin-bottom: var(--space-lg);">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-input" value="john@company.com">
                        </div>

                        <h2 class="settings-section-title" style="margin-top: var(--space-xl);">Preferences</h2>
                        
                        <div class="setting-row">
                            <div class="setting-info">
                                <h4>Email Notifications</h4>
                                <p>Receive updates about new AI models and features.</p>
                            </div>
                            <label class="toggle-switch">
                                <input type="checkbox" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>

                        <div class="setting-row">
                            <div class="setting-info">
                                <h4>Data Usage</h4>
                                <p>Allow AI.Core to train on your generations (Turn off for privacy).</p>
                            </div>
                            <label class="toggle-switch">
                                <input type="checkbox">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>

                        <div style="margin-top: var(--space-xl); display: flex; justify-content: flex-end;">
                            <button type="button" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="../../static/js/common.js"></script>
    <script>
        gsap.from(".settings-content", {
            y: 20,
            opacity: 0,
            duration: 0.5,
            ease: "power2.out"
        });
    </script>
</body>
</html>
