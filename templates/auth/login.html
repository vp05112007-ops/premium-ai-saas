<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Premium AI SaaS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/base.css">
    <link rel="stylesheet" href="../../static/css/auth.css">
</head>
<body class="auth-page">

    <div class="auth-bg-shape shape-1"></div>
    <div class="auth-bg-shape shape-2"></div>

    <main class="auth-container">
        <div class="auth-header">
            <a href="/templates/index.html" style="text-decoration: none; color: inherit; display: inline-block; margin-bottom: var(--space-md);">
                <div style="font-weight: 700; font-size: 1.5rem; letter-spacing: -0.02em;">
                    <span class="text-gradient">AI.</span>Core
                </div>
            </a>
            <h1>Welcome back</h1>
            <p>Enter your details to access your workspace.</p>
        </div>

        <form class="auth-form" action="../dashboard/index.html">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" class="auth-input" placeholder="name@company.com" required>
            </div>
            
            <div class="form-group">
                <div style="display: flex; justify-content: space-between;">
                    <label for="password">Password</label>
                    <a href="#" style="font-size: 0.875rem; color: var(--color-primary); text-decoration: none;">Forgot password?</a>
                </div>
                <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary auth-btn">Sign In</button>
            
            <button type="button" class="btn btn-ghost auth-btn" style="margin-top: 0; border: 1px solid var(--border-light); display: flex; align-items: center; justify-content: center; gap: 8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"></path></svg>
                Continue with Google
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Sign up for free</a>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="../../static/js/common.js"></script>
    <script>
        // Simple entrance animation
        gsap.from(".auth-container", {
            y: 30,
            opacity: 0,
            duration: 0.8,
            ease: "power3.out"
        });
    </script>
</body>
</html>
